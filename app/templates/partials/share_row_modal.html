<form
  hx-post="/tables/{{ table.id }}/rows/{{ row.id }}/share"
  hx-target="#share-row-modal-body"
  hx-swap="innerHTML"
  hx-disabled-elt="#share-row-send-btn, #share-row-cancel-btn"
  class="space-y-4">

  <p class="text-sm text-gray-600">
    Envoyer la fiche de la ligne <span class="font-semibold text-gray-800">#{{ row.id }}</span>
    ({{ columns | length }} colonne{{ 's' if columns | length > 1 else '' }} visible{{ 's' if columns | length > 1 else '' }}) par email.
  </p>

  {% if error %}
  <p class="text-xs text-red-600 font-medium bg-red-50 border border-red-200 rounded-lg px-3 py-2">&#9888; {{ error }}</p>
  {% endif %}

  <div>
    <label class="block text-xs font-medium text-gray-600 mb-1">Destinataire(s)</label>
    <input type="text" name="recipients" required
      value="{{ recipients_value | default('') }}"
      placeholder="ex. alice@exemple.com, bob@exemple.com"
      class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    <p class="text-xs text-gray-400 mt-1">Séparez plusieurs adresses par une virgule.</p>
  </div>

  <div>
    <label class="block text-xs font-medium text-gray-600 mb-1">Message (facultatif)</label>
    <textarea name="message" rows="3"
      placeholder="Un mot pour accompagner cet envoi…"
      class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none">{{ message_value | default('') }}</textarea>
  </div>

  <div class="flex gap-2 pt-2">
    <button type="submit" id="share-row-send-btn"
      class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-1.5 rounded-lg transition disabled:opacity-60 disabled:cursor-not-allowed">
      <span class="htmx-indicator-hide">Envoyer</span>
      <span class="htmx-indicator">
        <svg class="animate-spin w-3.5 h-3.5 mr-1 inline-block align-[-3px]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>Envoi…
      </span>
    </button>
    <button type="button" id="share-row-cancel-btn" onclick="closeShareRowModal()"
      class="text-sm text-gray-500 hover:text-gray-700 px-4 py-1.5 rounded-lg hover:bg-gray-100 transition disabled:opacity-60 disabled:cursor-not-allowed">
      Annuler
    </button>
  </div>
</form>
