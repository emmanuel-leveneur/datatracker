<div class="bg-white border border-blue-200 rounded-xl shadow-sm p-5 mb-4">
  <h3 class="text-sm font-semibold text-gray-700 mb-4">Ajouter une ligne</h3>
  <form
    hx-post="/tables/{{ table.id }}/rows/new"
    hx-target="#table-body"
    hx-swap="innerHTML"
    hx-include="#filters-zone, #global-search"
    class="space-y-3">
    <input type="hidden" name="page" value="{{ page | default(1) }}">

    {% include "partials/row_fields.html" %}

    <div class="flex gap-2 pt-2">
      <button type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-1.5 rounded-lg transition">
        Ajouter
      </button>
      <button type="button" onclick="document.getElementById('row-form-area').innerHTML = ''"
        class="text-sm text-gray-500 hover:text-gray-700 px-4 py-1.5 rounded-lg hover:bg-gray-100 transition">
        Annuler
      </button>
    </div>
  </form>
</div>
