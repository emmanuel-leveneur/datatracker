<div class="flex flex-col items-center text-center gap-3 py-4">
  <div class="w-11 h-11 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
    <i data-lucide="check" class="w-5 h-5"></i>
  </div>
  <div>
    <p class="text-sm font-semibold text-gray-800">
      {{ row_count }} ligne{{ 's' if row_count > 1 else '' }} envoyée{{ 's' if row_count > 1 else '' }} par email
    </p>
    <p class="text-xs text-gray-500 mt-1">
      à {{ recipients | length }} destinataire{{ 's' if recipients | length > 1 else '' }} :
      {{ recipients | join(', ') }}
    </p>
  </div>
  <button type="button"
    onclick="{% if modal == 'row' %}closeShareRowModal(){% else %}closeBulkShareModal(){% endif %}"
    class="text-sm text-white bg-blue-600 hover:bg-blue-700 px-5 py-1.5 rounded-lg transition mt-1">
    Fermer
  </button>
</div>
