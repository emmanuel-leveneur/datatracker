<form
  hx-post="/tables/{{ table.id }}/rows/bulk-edit"
  hx-target="#table-body"
  hx-swap="innerHTML"
  hx-include="#filters-zone, #global-search"
  hx-on:htmx:config-request="event.detail.parameters.row_ids = window.bulkSelectedIds ? [...window.bulkSelectedIds] : []"
  class="space-y-4">
  <input type="hidden" name="page" value="{{ page | default(1) }}">

  <p id="bulk-edit-count-msg" class="text-sm text-gray-600"></p>

  {% if error %}
  <p class="text-xs text-red-600 font-medium bg-red-50 border border-red-200 rounded-lg px-3 py-2">&#9888; {{ error }}</p>
  {% endif %}

  {% if columns %}
  <div>
    <label class="block text-xs font-medium text-gray-600 mb-1">Colonne à modifier</label>
    <select name="col_id" required
      hx-get="/tables/{{ table.id }}/rows/bulk-edit/field"
      hx-target="#bulk-edit-value-area"
      hx-swap="innerHTML"
      hx-trigger="change"
      class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
      <option value="">— Choisir —</option>
      {% for col in columns %}
      <option value="{{ col.id }}">{{ col.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs font-medium text-gray-600 mb-1">Nouvelle valeur</label>
    <div id="bulk-edit-value-area" class="text-sm text-gray-400 italic">Sélectionnez d'abord une colonne.</div>
  </div>

  <div class="flex gap-2 pt-2">
    <button type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-1.5 rounded-lg transition">
      Appliquer
    </button>
    <button type="button" onclick="closeBulkEditModal()"
      class="text-sm text-gray-500 hover:text-gray-700 px-4 py-1.5 rounded-lg hover:bg-gray-100 transition">
      Annuler
    </button>
  </div>
  {% else %}
  <p class="text-sm text-gray-400 italic">Aucune colonne modifiable en masse sur cette table.</p>
  <div class="flex gap-2 pt-2">
    <button type="button" onclick="closeBulkEditModal()"
      class="text-sm text-gray-500 hover:text-gray-700 px-4 py-1.5 rounded-lg hover:bg-gray-100 transition">
      Fermer
    </button>
  </div>
  {% endif %}
</form>
