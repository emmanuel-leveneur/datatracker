{% extends "base.html" %}
{% block title %}Email envoyé — DataTracker{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="bg-white shadow-md rounded-xl p-8 text-center">
      <div class="flex justify-center mb-4">
        <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center">
          <i data-lucide="mail" class="w-7 h-7 text-blue-500"></i>
        </div>
      </div>
      <h1 class="text-xl font-bold text-gray-800 mb-2">Vérifiez votre boîte mail</h1>
      <p class="text-sm text-gray-500 mb-6">
        Si un compte est associé à <strong>{{ email }}</strong>, vous allez recevoir un email avec un lien de réinitialisation valable <strong>30 minutes</strong>.
      </p>
      <a href="/auth/login"
        class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-sm transition text-center">
        Retour à la connexion
      </a>
    </div>
  </div>
</div>
{% endblock %}
