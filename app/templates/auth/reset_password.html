{% extends "base.html" %}
{% block title %}Nouveau mot de passe — DataTracker{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="bg-white shadow-md rounded-xl p-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Nouveau mot de passe</h1>

      {% if error %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">{{ error }}</div>
      {% endif %}

      <form method="post" action="/auth/reset-password" class="space-y-4">
        <input type="hidden" name="token" value="{{ token }}" />
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe</label>
          <input type="password" name="password" required autofocus minlength="8"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <p class="text-xs text-gray-400 mt-1">8 caractères minimum</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot de passe</label>
          <input type="password" name="password_confirm" required minlength="8"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-sm transition">
          Enregistrer le nouveau mot de passe
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
