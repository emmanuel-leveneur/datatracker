{% extends "base.html" %}
{% block title %}Lien invalide — DataTracker{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="bg-white shadow-md rounded-xl p-8 text-center">
      <div class="flex justify-center mb-4">
        <div class="w-14 h-14 bg-red-50 rounded-full flex items-center justify-center">
          <i data-lucide="alert-circle" class="w-7 h-7 text-red-400"></i>
        </div>
      </div>
      <h1 class="text-xl font-bold text-gray-800 mb-2">Lien invalide ou expiré</h1>
      <p class="text-sm text-gray-500 mb-6">Ce lien de réinitialisation est expiré, déjà utilisé ou incorrect. Faites une nouvelle demande.</p>
      <a href="/auth/forgot-password"
        class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-sm transition text-center">
        Nouvelle demande
      </a>
    </div>
  </div>
</div>
{% endblock %}
